<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Consultation · Commandes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root { --navy:#141A52; --blue:#2B3F94; --lime:#B5DA3A; --gray:#E3E6E9; --muted:#5B628F; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Montserrat',system-ui,sans-serif; background:var(--gray); color:var(--navy); padding:24px 16px 48px; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { margin:0 0 20px; font-size:26px; }
  .card { background:#fff; border-radius:20px; padding:20px; box-shadow:0 8px 24px rgba(20,26,82,.1); margin-bottom:16px; }
  button { font:inherit; font-weight:700; border:0; border-radius:12px; padding:12px 18px; background:var(--navy); color:#fff; cursor:pointer; }
  input[type=search] { font:inherit; padding:12px 14px; border:2px solid #D5DAE6; border-radius:12px; flex:1; min-width:180px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; font-size:14px; }
  th { text-align:left; font-size:12px; letter-spacing:.1em; color:var(--muted); padding:8px 10px; }
  td { padding:10px; border-top:1px solid #E5E8F0; vertical-align:top; }
  td.num { text-align:right; font-weight:700; white-space:nowrap; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
  .badge.ok { background:var(--lime); color:var(--navy); }
  .badge.wait { background:#FFF3CD; color:#7A5B00; }
  input[type=password] { font:inherit; padding:12px 14px; border:2px solid #D5DAE6; border-radius:12px; width:100%; max-width:320px; }
  [hidden] { display:none !important; }
  .err { color:#B3261E; font-weight:600; min-height:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Commandes · I Meet You 2026</h1>
  <div id="login" class="card">
    <label for="pw" style="font-weight:600;display:block;margin-bottom:8px">Mot de passe</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password">
      <button id="go">Entrer</button>
    </div>
    <div id="err" class="err" role="alert" style="margin-top:10px"></div>
  </div>
  <div id="list" hidden>
  <div class="card row">
    <input id="q" type="search" placeholder="Rechercher (nom, ETU, classe, réf)…">
    <span id="count" style="font-weight:700"></span>
    <button id="refresh">Actualiser</button>
  </div>
  <div class="card scroll">
    <table>
      <thead><tr><th>RÉF</th><th>DATE</th><th>NOM ET PRÉNOMS</th><th>ETU</th><th>CLASSE</th><th>PLATS</th><th style="text-align:right">TOTAL</th><th>STATUT</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString('fr-FR').replace(/[  ]/g, '.') + ' Ar';
const dateFmt = new Intl.DateTimeFormat('fr-FR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Indian/Antananarivo' });
let orders = [];
let key = ''; // gardé en mémoire seulement : recharger la page redemande le mot de passe

function draw() {
  const q = $('q').value.trim().toLowerCase();
  const shown = orders.filter((o) => !q || [o.ref, o.nom, o.etu, o.classe].some((v) => String(v || '').toLowerCase().includes(q)));
  $('count').textContent = shown.length + ' commande' + (shown.length > 1 ? 's' : '');
  const tb = $('rows'); tb.replaceChildren();
  for (const o of shown) {
    const tr = document.createElement('tr');
    const cells = [o.ref, dateFmt.format(new Date(o.createdAt)), o.nom, o.etu, o.classe || '', o.items.map((i) => i.qty + '× ' + i.name).join(', '), fmt(o.total)];
    cells.forEach((c, idx) => {
      const td = document.createElement('td');
      td.textContent = c; // textContent : jamais interprété comme du HTML
      if (idx === 6) td.className = 'num';
      tr.append(td);
    });
    const st = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge ' + (o.confirmed ? 'ok' : 'wait');
    badge.textContent = o.confirmed ? 'Confirmée' : 'En attente';
    st.append(badge);
    tr.append(st);
    tb.append(tr);
  }
}

async function load() {
  $('err').textContent = '';
  try {
    const r = await fetch('/api/orders?view=public', { headers: { 'x-list-key': key } });
    if (r.status === 401) throw new Error('Mot de passe incorrect.');
    if (!r.ok) throw new Error('Impossible de charger les commandes.');
    orders = (await r.json()).orders;
    $('login').hidden = true;
    $('list').hidden = false;
    draw();
  } catch (e) {
    key = '';
    $('login').hidden = false;
    $('list').hidden = true;
    $('err').textContent = e.message;
  }
}

function enter() { key = $('pw').value; $('pw').value = ''; load(); }
$('go').onclick = enter;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });

$('q').addEventListener('input', draw);
$('refresh').onclick = load;
</script>
</body>
</html>
