<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Commandes</title>
<!-- Page de gestion : confirmer les commandes. La consultation en lecture seule est sur /commandes.html -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  :root { --navy:#141A52; --blue:#2B3F94; --lime:#B5DA3A; --gray:#E3E6E9; --muted:#5B628F; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Montserrat',system-ui,sans-serif; background:var(--gray); color:var(--navy); padding:24px 16px 48px; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { margin:0 0 20px; font-size:26px; }
  .card { background:#fff; border-radius:20px; padding:20px; box-shadow:0 8px 24px rgba(20,26,82,.1); margin-bottom:16px; }
  input[type=password] { font:inherit; padding:12px 14px; border:2px solid #D5DAE6; border-radius:12px; width:100%; max-width:320px; }
  button { font:inherit; font-weight:700; border:0; border-radius:12px; padding:12px 18px; background:var(--navy); color:#fff; cursor:pointer; }
  button.lime { background:var(--lime); color:var(--navy); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .search { font:inherit; padding:12px 14px; border:2px solid #D5DAE6; border-radius:12px; width:100%; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
  .stat { background:var(--navy); color:#fff; border-radius:16px; padding:14px 16px; }
  .stat small { display:block; color:#C9CFEE; font-size:12px; line-height:1.3; }
  .stat b { font-size:26px; font-weight:800; }
  .stat.lime { background:var(--lime); color:var(--navy); }
  .stat.lime small { color:var(--navy); }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:640px; font-size:14px; }
  th { text-align:left; font-size:12px; letter-spacing:.1em; color:var(--muted); padding:8px 10px; }
  td { padding:10px; border-top:1px solid #E5E8F0; vertical-align:top; }
  td.num { text-align:right; font-weight:700; white-space:nowrap; }
  button.small { padding:8px 14px; font-size:13px; white-space:nowrap; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; white-space:nowrap; }
  .badge.ok { background:var(--lime); color:var(--navy); }
  .badge.wait { background:#FFF3CD; color:#7A5B00; }
  .err { color:#B3261E; font-weight:600; margin-top:10px; min-height:20px; }
  .overlay { position:fixed; inset:0; background:rgba(20,26,82,.75); display:flex; align-items:center; justify-content:center; padding:16px; z-index:100; }
  .dialog { background:#fff; border-radius:20px; border-top:8px solid #B3261E; padding:28px 24px; max-width:440px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .dialog .icon { font-size:48px; line-height:1; }
  .dialog h2 { margin:10px 0; font-size:22px; color:#B3261E; }
  .dialog p { margin:8px 0; font-size:15px; }
  .dialog .hint { color:var(--muted); font-size:13px; margin-bottom:16px; }
  button.danger { background:#B3261E; }
  button:disabled { opacity:.6; cursor:wait; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Commandes · I Meet You 2026</h1>

  <div id="login" class="card">
    <label for="pw" style="font-weight:600;display:block;margin-bottom:8px">Mot de passe admin</label>
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password">
      <button id="go">Entrer</button>
    </div>
    <div id="err" class="err" role="alert"></div>
  </div>

  <div id="panel" hidden>
    <div class="card row" style="justify-content:space-between">
      <span id="count" style="font-weight:700"></span>
      <span class="row">
        <button id="refresh">Actualiser</button>
        <button id="dl" class="lime">Télécharger l'Excel</button>
        <button id="wipe" style="background:#fff;color:#B3261E;border:2px solid #B3261E">Tout effacer</button>
      </span>
    </div>
    <div id="stats" class="stats" style="margin-bottom:16px"></div>
    <div class="card" style="margin-bottom:0;border-radius:20px 20px 0 0">
      <label for="search" style="font-weight:600;display:block;margin-bottom:8px">Rechercher une commande</label>
      <input id="search" class="search" type="search" placeholder="Référence, nom, classe, contact, plat, statut…">
    </div>
    <div class="card scroll" style="border-radius:0 0 20px 20px">
      <table>
        <thead><tr><th>RÉF</th><th>DATE</th><th>NOM ET PRÉNOMS</th><th>ETU</th><th>CLASSE</th><th>CONTACT</th><th>PLATS</th><th style="text-align:right">TOTAL</th><th>STATUT</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="modal" class="overlay" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="dialog">
    <div class="icon">⚠️</div>
    <h2 id="modal-title">Supprimer toutes les commandes ?</h2>
    <p><b id="modal-count"></b> vont être <b>définitivement supprimées</b>. Cette action est irréversible.</p>
    <p class="hint">Pense à télécharger l'Excel avant si tu veux les garder.</p>
    <button id="modal-dl" class="lime" style="width:100%;margin-bottom:10px">Télécharger l'Excel d'abord</button>
    <div class="row" style="justify-content:center">
      <button id="modal-cancel">Annuler</button>
      <button id="modal-ok" class="danger">Oui, tout supprimer</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString('fr-FR').replace(/[  ]/g, '.') + ' Ar';
const dateFmt = new Intl.DateTimeFormat('fr-FR', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Indian/Antananarivo' });
let key = ''; // gardé en mémoire seulement : recharger la page redemande le mot de passe
let loadedOrders = [];

async function api(path, method, body) {
  const headers = { 'x-admin-key': key };
  if (body) headers['Content-Type'] = 'application/json';
  const r = await fetch(path, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) throw new Error('Mot de passe incorrect.');
  if (!r.ok) throw new Error('Erreur serveur.');
  return r;
}

function stat(label, value, cls) {
  const d = document.createElement('div'); d.className = 'stat ' + (cls || '');
  const s = document.createElement('small'); s.textContent = label;
  const b = document.createElement('b'); b.textContent = value;
  d.append(s, b);
  return d;
}

async function load() {
  const { orders } = await (await api('/api/orders')).json();
  loadedOrders = orders;
  $('login').hidden = true;
  $('panel').hidden = false;
  $('count').textContent = orders.length + ' commande' + (orders.length > 1 ? 's' : '');

  const perDish = {}; let grand = 0;
  for (const o of orders) {
    grand += o.total;
    for (const i of o.items) perDish[i.name] = (perDish[i.name] || 0) + i.qty;
  }
  const stats = $('stats'); stats.replaceChildren();
  for (const [name, n] of Object.entries(perDish)) stats.append(stat(name, String(n)));
  const nbOk = orders.filter((o) => o.confirmed).length;
  stats.append(stat('Commandes confirmées', nbOk + ' / ' + orders.length));
  stats.append(stat('Montant total à encaisser', fmt(grand), 'lime'));

  renderOrders();
}

function renderOrders() {
  const query = $('search').value.trim().toLocaleLowerCase('fr');
  const orders = loadedOrders.filter((o) => {
    const searchable = [
      o.ref, dateFmt.format(new Date(o.createdAt)), o.nom, o.etu, o.classe, o.contact,
      o.items.map((i) => i.qty + '× ' + i.name).join(', '),
      o.confirmed ? 'Confirmée' : 'En attente'
    ].join(' ').toLocaleLowerCase('fr');
    return searchable.includes(query);
  });
  $('count').textContent = query
    ? orders.length + ' résultat' + (orders.length > 1 ? 's' : '') + ' sur ' + loadedOrders.length + ' commande' + (loadedOrders.length > 1 ? 's' : '')
    : loadedOrders.length + ' commande' + (loadedOrders.length > 1 ? 's' : '');

  const tb = $('rows'); tb.replaceChildren();
  for (const o of orders) {
    const tr = document.createElement('tr');
    const cells = [o.ref, dateFmt.format(new Date(o.createdAt)), o.nom, o.etu, o.classe || '', o.contact || '', o.items.map((i) => i.qty + '× ' + i.name).join(', '), fmt(o.total)];
    cells.forEach((c, idx) => {
      const td = document.createElement('td');
      td.textContent = c; // textContent : les noms saisis par les étudiants ne sont jamais interprétés comme du HTML
      if (idx === 7) td.className = 'num';
      tr.append(td);
    });
    const st = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge ' + (o.confirmed ? 'ok' : 'wait');
    badge.textContent = o.confirmed ? 'Confirmée' : 'En attente';
    st.append(badge);
    const act = document.createElement('td');
    if (!o.confirmed) {
      const btn = document.createElement('button');
      btn.className = 'small lime';
      btn.textContent = 'Confirmer';
      btn.onclick = async () => {
        btn.disabled = true;
        try {
          await api('/api/orders', 'PATCH', { ref: o.ref });
          await load();
        } catch (e) { alert(e.message); btn.disabled = false; }
      };
      act.append(btn);
    }
    tr.append(st, act);
    tb.append(tr);
  }
}

async function enter() {
  key = $('pw').value || key;
  $('err').textContent = '';
  try { await load(); $('pw').value = ''; }
  catch (e) { key = ''; $('err').textContent = e.message; $('login').hidden = false; $('panel').hidden = true; }
}

$('go').onclick = enter;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
$('refresh').onclick = () => load().catch((e) => alert(e.message));
$('search').addEventListener('input', renderOrders);
$('dl').onclick = async () => {
  try {
    const blob = await (await api('/api/export')).blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'commandes-it-volunteers.xlsx';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { alert(e.message); }
};
$('wipe').onclick = () => {
  $('modal-count').textContent = loadedOrders.length + ' commande' + (loadedOrders.length > 1 ? 's' : '');
  $('modal').hidden = false;
  $('modal-cancel').focus();
};
const closeModal = () => { $('modal').hidden = true; };
$('modal-cancel').onclick = closeModal;
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
$('modal-dl').onclick = $('dl').onclick;
$('modal-ok').onclick = async () => {
  $('modal-ok').disabled = true;
  try { await api('/api/orders', 'DELETE'); closeModal(); await load(); }
  catch (e) { alert(e.message); }
  $('modal-ok').disabled = false;
};
</script>
</body>
</html>
